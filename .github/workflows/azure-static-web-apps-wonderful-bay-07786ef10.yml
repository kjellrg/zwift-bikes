name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
      - devel
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
      - devel

permissions:
  contents: read

# Superseded preview runs have nothing left to say, so cancel them. Pushes to
# main/devel are deliberately excluded: cancelling a half-finished upload to
# Azure is a worse outcome than letting it finish and be replaced.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      # dorny/paths-filter only needs a checkout for non-PR triggers (push,
      # in this workflow's case) - it uses git diff/merge-base locally there
      # since there's no PR to query the GitHub API for instead. Omitting
      # this made push-to-main runs fail with "fatal: not a git repository".
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 20
          persist-credentials: false
      - name: Filter relevant paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            app:
              - "app/**"
              - "server/**"
              - "shared/**"
              # `public/staticwebapp.config.json` used to be listed here and
              # could never match: that file is generated at build time by
              # nitro's azure-swa preset, at the repo root, and is gitignored.
              # Its real inputs are nuxt.config.ts (below) and scripts/**,
              # which `npm run build` now runs via trim-swa-config.mjs.
              - "scripts/**"
              - "nuxt.config.ts"
              - "package.json"
              - "package-lock.json"
              - ".github/workflows/azure-static-web-apps-wonderful-bay-07786ef10.yml"

  checks:
    name: Checks
    uses: ./.github/workflows/checks.yml
    permissions:
      contents: read # Ceiling for the called workflow, which asks for the same.

  build_and_deploy_job:
    # Fork PRs are excluded here and picked up by `fork_build_job` below: a
    # `pull_request` run from a fork gets no repository secrets, so
    # AZURE_STATIC_WEB_APPS_API_TOKEN_* is empty and the deploy can only fail.
    if: >-
      github.event_name == 'push'
      || (github.event_name == 'pull_request'
      && github.event.action != 'closed'
      && github.event.pull_request.head.repo.fork == false)
    needs: [changes, checks]
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    permissions:
      contents: read
      pull-requests: write # required by repo_token below to comment/manage PR preview links
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.app == 'true'
        with:
          submodules: true
          lfs: false
          persist-credentials: false
      - name: Build And Deploy
        if: needs.changes.outputs.app == 'true'
        id: builddeploy
        # `v1` on this action is both a tag and a branch, and they point at
        # different commits: the tag is this SHA, the branch has moved on. The
        # pin below is correct for the tag. `zizmor --persona=pedantic` with
        # online audits resolves the branch instead and reports a
        # `ref-version-mismatch` here - that finding is the ambiguity, not a
        # stale pin, so don't "fix" it by bumping the SHA. Moving to the
        # branch head is a real upgrade of the production deploy path and
        # belongs in its own change.
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WONDERFUL_BAY_07786EF10 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "/" # App source code path
          api_location: ".output/server" # Api source code path - optional
          output_location: ".output/public" # Built app content directory - optional
          production_branch: "main" # Only this branch deploys to the production environment; others get their own preview environment
          ###### End of Repository/Build Configurations ######
        env:
          # Baked into the bundle by `runtimeConfig.public.buildSha` in
          # nuxt.config.ts, so a bug report can say which build it came from.
          # Azure's action forwards a step `env:` block into the Oryx build
          # container, which is where `nuxt build` actually runs - the runner's
          # own environment isn't visible in there.
          #
          # On a pull_request event `github.sha` is the ephemeral merge commit,
          # which exists in no branch and can't be checked out later; the head
          # SHA is the one a preview-environment report should name.
          #
          # Not `NUXT_PUBLIC_BUILD_SHA` - see the comment on `buildSha` in
          # nuxt.config.ts for why that name would defeat the shortening.
          BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

  # Was .github/workflows/build.yml. It lived in its own workflow, which meant
  # both workflows triggered on every `pull_request` and both called
  # `checks.yml` - running the same ~45s of lint/typecheck/validate twice per
  # PR. Nothing dedupes a reusable workflow across callers (a shared
  # concurrency group can only cancel, which would kill the deploy), so the
  # only structural fix is one entry point per event. Merging it here also puts
  # the fork and non-fork halves of the same decision side by side.
  fork_build_job:
    name: npm run build (fork PR)
    # Fork PRs only - see `build_and_deploy_job` above. This is the sole build
    # coverage such a PR gets, so unlike the deploy it is not behind the
    # `changes` paths filter: it is rare enough that always building is worth
    # more than the minutes saved.
    if: >-
      github.event_name == 'pull_request'
      && github.event.action != 'closed'
      && github.event.pull_request.head.repo.fork
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build

  close_pull_request_job:
    if: >-
      github.event_name == 'pull_request'
      && github.event.action == 'closed'
      && github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    permissions:
      contents: read
    steps:
      - name: Close Pull Request
        id: closepullrequest
        # Same tag-vs-branch note as build_and_deploy_job above.
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WONDERFUL_BAY_07786EF10 }}
          action: "close"
