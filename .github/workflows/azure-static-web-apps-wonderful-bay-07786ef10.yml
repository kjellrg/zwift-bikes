name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
      - devel
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
      - devel

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      # dorny/paths-filter only needs a checkout for non-PR triggers (push,
      # in this workflow's case) - it uses git diff/merge-base locally there
      # since there's no PR to query the GitHub API for instead. Omitting
      # this made push-to-main runs fail with "fatal: not a git repository".
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 20
          persist-credentials: false
      - name: Filter relevant paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            app:
              - "app/**"
              - "server/**"
              - "shared/**"
              - "public/staticwebapp.config.json"
              - "nuxt.config.ts"
              - "package.json"
              - "package-lock.json"
              - ".github/workflows/azure-static-web-apps-wonderful-bay-07786ef10.yml"

  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    needs: changes
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    permissions:
      contents: read
      pull-requests: write # required by repo_token below to comment/manage PR preview links
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: needs.changes.outputs.app == 'true'
        with:
          submodules: true
          lfs: false
          persist-credentials: false
      - name: Build And Deploy
        if: needs.changes.outputs.app == 'true'
        id: builddeploy
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WONDERFUL_BAY_07786EF10 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "/" # App source code path
          api_location: ".output/server" # Api source code path - optional
          output_location: ".output/public" # Built app content directory - optional
          production_branch: "main" # Only this branch deploys to the production environment; others get their own preview environment
          ###### End of Repository/Build Configurations ######

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    permissions:
      contents: read
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WONDERFUL_BAY_07786EF10 }}
          action: "close"
