name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
      - devel
    paths:
      - "app/**"
      - "server/**"
      - "shared/**"
      - "public/staticwebapp.config.json"
      - "nuxt.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/azure-static-web-apps-wonderful-bay-07786ef10.yml"
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
      - devel
    paths:
      - "app/**"
      - "server/**"
      - "shared/**"
      - "public/staticwebapp.config.json"
      - "nuxt.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/azure-static-web-apps-wonderful-bay-07786ef10.yml"

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WONDERFUL_BAY_07786EF10 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "/" # App source code path
          api_location: ".output/server" # Api source code path - optional
          output_location: ".output/public" # Built app content directory - optional
          production_branch: "main" # Only this branch deploys to the production environment; others get their own preview environment
          ###### End of Repository/Build Configurations ######

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WONDERFUL_BAY_07786EF10 }}
          action: "close"
