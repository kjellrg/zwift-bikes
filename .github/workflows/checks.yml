name: Checks

on:
  push:
    branches:
      - main
      - devel
  pull_request:
    branches:
      - main
      - devel

permissions: {}

# Lint/typecheck/validate results only ever describe the newest commit on a
# branch, so a superseded run has nothing left to say - cancel it. The deploy
# workflow deliberately does not do this: cancelling a half-finished upload to
# Azure is a worse outcome than letting it finish and be replaced.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, validate
    runs-on: ubuntu-latest
    permissions:
      contents: read # Needed to clone the repo; nothing here writes back.
    # Deliberately no `dorny/paths-filter` gate, unlike the build and zizmor
    # workflows. The whole job is ~25s of actual work, so a filter job would
    # cost about as much wall-clock as it saves, and these checks read config
    # that lives outside any tidy path list (eslint.config.mjs, tsconfig,
    # .nuxt/ generated by `nuxt prepare`). Always running also means the job
    # reports a real pass/fail rather than "skipped", which is what you want
    # if it ever becomes a required status check.
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: npm
      # `npm ci` is what generates `.nuxt/eslint.config.mjs` (via the
      # `postinstall` -> `nuxt prepare` hook) - eslint.config.mjs imports it,
      # so lint cannot run off a bare checkout.
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      # The same data validators `npm run build` chains ahead of `nuxt build`.
      # Running them here too costs ~4s and fails a bad frame/wheel/event edit
      # in under a minute, instead of ~9 minutes into the Oryx build inside the
      # Azure deploy workflow - which is the only place they otherwise run in
      # CI, and which fork PRs never reach at all.
      - name: Validate data
        run: npm run validate
