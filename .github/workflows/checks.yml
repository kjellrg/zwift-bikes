name: Checks

# Reusable only - this workflow has no trigger of its own. The Azure deploy
# workflow is the single PR/push entry point and calls it once, so its build,
# deploy and fork-build jobs can all `needs:` these checks rather than racing
# alongside them. Keep it to one caller per event: nothing dedupes a reusable
# workflow across callers, so a second one would just run all of this twice.
on:
  workflow_call:

permissions:
  contents: read # Needed to clone the repo; nothing here writes back.

jobs:
  checks:
    name: Lint, typecheck, validate
    runs-on: ubuntu-latest
    # Deliberately no `dorny/paths-filter` gate, unlike the callers' own build
    # gating. The whole job is ~25s of actual work, so a filter job would cost
    # about as much wall-clock as it saves, and these checks read config that
    # lives outside any tidy path list (eslint.config.mjs, tsconfig, and the
    # .nuxt/ output `nuxt prepare` generates). Always running also means the
    # job reports a real pass/fail rather than "skipped", which is what you
    # want if it ever becomes a required status check.
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: npm
      # `npm ci` is what generates `.nuxt/eslint.config.mjs` (via the
      # `postinstall` -> `nuxt prepare` hook) - eslint.config.mjs imports it,
      # so lint cannot run off a bare checkout.
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      # Prose-only spellcheck of the event specifications, docs and README -
      # scope and dictionaries live in cspell.config.yaml. The zwift-data
      # dictionary it needs is generated by `npm ci` (postinstall), same as
      # the .nuxt/ config lint depends on.
      - name: Spellcheck
        run: npm run spellcheck
      - name: Typecheck
        run: npm run typecheck
      # The same data validators `npm run build` chains ahead of `nuxt build`.
      # Running them here costs ~4s and fails a bad frame/wheel/event edit in
      # under a minute, instead of ~9 minutes into the Oryx build inside the
      # Azure deploy workflow.
      - name: Validate data
        run: npm run validate
      # Vitest unit suite over shared/ and server/utils logic - physics golden
      # tests, scoring/classifier invariants, API query schemas. ~2s.
      - name: Unit tests
        run: npm run test
