name: Build

on:
  pull_request:
    branches:
      - main
      - devel

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/checks.yml
    permissions:
      contents: read # Ceiling for the called workflow, which asks for the same.

  build:
    name: npm run build
    needs: checks
    runs-on: ubuntu-latest
    # Fork PRs only. `pull_request` runs from a fork don't get repository
    # secrets, so the Azure SWA workflow's build-and-deploy job can't validate
    # them - this is the only build coverage such a PR gets. For PRs from this
    # repo, that workflow already runs the identical `npm run build` (via Oryx)
    # on its way to deploying a preview, so building here as well would just
    # run the same command twice - ~9 min a side now that route pages are
    # prerendered.
    if: github.event.pull_request.head.repo.fork
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
