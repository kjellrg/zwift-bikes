<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 362" width="760" height="362" role="img" aria-labelledby="ttl dsc">
<title id="ttl">What correcting a wrong event lead-in does to the model error</title>
<desc id="dsc">Six Makuri race fields. For each, the median finish-time error of the shipped race model, shown with Zwift's own published lead-in and again with the corrected lead-in. The three routes whose lead-in Zwift under-reports by about two kilometres move from between four and eleven percent too fast to within two and a half percent of zero. The three control races, whose lead-ins are sound, do not move at all. The shaded band marks plus or minus three percent, which is the model's own accuracy on races it reproduces well.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.t{fill:#6e7781}
.h{fill:#1f2328}
.grid{stroke:#6e7781;opacity:.28}
.band{fill:#1a7f37;opacity:.09}
.zero{stroke:#1a7f37;opacity:.65}
.before{fill:#cf222e;opacity:.85}
.after{fill:#0969da}
.arrow{stroke:#6e7781;opacity:.55}
.still{stroke:#6e7781;opacity:.3}
@media (prefers-color-scheme:dark){
.t{fill:#9198a1}
.h{fill:#f0f6fc}
.grid{stroke:#9198a1;opacity:.22}
.band{fill:#3fb950;opacity:.12}
.zero{stroke:#3fb950}
.before{fill:#ff7b72}
.after{fill:#58a6ff}
.arrow{stroke:#9198a1;opacity:.5}
.still{stroke:#9198a1;opacity:.3}
}
</style>
<rect x="479.5" y="50" width="189.0" height="234" class="band"/>
<line x1="196.0" y1="50" x2="196.0" y2="284" class="grid" stroke-width="0.5"/>
<text x="196.0" y="302" font-size="11" class="t" text-anchor="middle">-12%</text>
<line x1="259.0" y1="50" x2="259.0" y2="284" class="grid" stroke-width="0.5"/>
<text x="259.0" y="302" font-size="11" class="t" text-anchor="middle">-10%</text>
<line x1="322.0" y1="50" x2="322.0" y2="284" class="grid" stroke-width="0.5"/>
<text x="322.0" y="302" font-size="11" class="t" text-anchor="middle">-8%</text>
<line x1="385.0" y1="50" x2="385.0" y2="284" class="grid" stroke-width="0.5"/>
<text x="385.0" y="302" font-size="11" class="t" text-anchor="middle">-6%</text>
<line x1="448.0" y1="50" x2="448.0" y2="284" class="grid" stroke-width="0.5"/>
<text x="448.0" y="302" font-size="11" class="t" text-anchor="middle">-4%</text>
<line x1="511.0" y1="50" x2="511.0" y2="284" class="grid" stroke-width="0.5"/>
<text x="511.0" y="302" font-size="11" class="t" text-anchor="middle">-2%</text>
<line x1="574.0" y1="50" x2="574.0" y2="284" class="zero" stroke-width="1.4"/>
<text x="574.0" y="302" font-size="11" class="t" text-anchor="middle">0%</text>
<line x1="637.0" y1="50" x2="637.0" y2="284" class="grid" stroke-width="0.5"/>
<text x="637.0" y="302" font-size="11" class="t" text-anchor="middle">+2%</text>
<line x1="700.0" y1="50" x2="700.0" y2="284" class="grid" stroke-width="0.5"/>
<text x="700.0" y="302" font-size="11" class="t" text-anchor="middle">+4%</text>
<text x="574.0" y="42" font-size="11" class="t" text-anchor="middle">model matches reality</text>
<text x="16" y="26" font-size="13" class="h" font-weight="600">Correcting the event lead-in, median finish-time error per field</text>
<text x="16" y="44" font-size="11.5" class="t">Negative = the model predicts faster than the field actually rode. Circles: zwift-data's lead-in. Filled: corrected.</text>
<text x="182" y="90" font-size="11.5" class="t" text-anchor="end">Mech Isle Mayhem (n=53)</text>
<line x1="232.5" y1="86" x2="504.9" y2="86" class="arrow" stroke-width="1.4"/>
<circle cx="232.5" cy="86" r="5" fill="none" stroke="currentColor" class="before" stroke-width="1.8"/>
<circle cx="504.9" cy="86" r="5" class="after"/>
<text x="232.5" y="76" font-size="10.5" class="t" text-anchor="middle">-10.8%</text>
<text x="504.9" y="76" font-size="10.5" class="t" text-anchor="middle">-2.2%</text>
<text x="708" y="90" font-size="10.5" class="t">+2.06 km</text>
<text x="182" y="124" font-size="11.5" class="t" text-anchor="end">Urumaze (n=152)</text>
<line x1="391.7" y1="120" x2="596.5" y2="120" class="arrow" stroke-width="1.4"/>
<circle cx="391.7" cy="120" r="5" fill="none" stroke="currentColor" class="before" stroke-width="1.8"/>
<circle cx="596.5" cy="120" r="5" class="after"/>
<text x="391.7" y="110" font-size="10.5" class="t" text-anchor="middle">-5.8%</text>
<text x="596.5" y="110" font-size="10.5" class="t" text-anchor="middle">+0.7%</text>
<text x="708" y="124" font-size="10.5" class="t">+2.05 km</text>
<text x="182" y="158" font-size="11.5" class="t" text-anchor="end">Urumaze, second field (n=12)</text>
<line x1="293.4" y1="154" x2="499.5" y2="154" class="arrow" stroke-width="1.4"/>
<circle cx="293.4" cy="154" r="5" fill="none" stroke="currentColor" class="before" stroke-width="1.8"/>
<circle cx="499.5" cy="154" r="5" class="after"/>
<text x="293.4" y="144" font-size="10.5" class="t" text-anchor="middle">-8.9%</text>
<text x="499.5" y="144" font-size="10.5" class="t" text-anchor="middle">-2.4%</text>
<text x="708" y="158" font-size="10.5" class="t">+2.05 km</text>
<text x="182" y="192" font-size="11.5" class="t" text-anchor="end">Turf N Surf (n=34)</text>
<circle cx="538.0" cy="188" r="5" class="after"/>
<text x="538.0" y="178" font-size="10.5" class="t" text-anchor="middle">-1.1%</text>
<text x="708" y="192" font-size="10.5" class="t">unchanged</text>
<text x="182" y="226" font-size="11.5" class="t" text-anchor="end">Neokyo All-Nighter (n=9)</text>
<circle cx="537.3" cy="222" r="5" class="after"/>
<text x="537.3" y="212" font-size="10.5" class="t" text-anchor="middle">-1.2%</text>
<text x="708" y="226" font-size="10.5" class="t">unchanged</text>
<text x="182" y="260" font-size="11.5" class="t" text-anchor="end">Makuri 40 (n=10)</text>
<circle cx="593.1" cy="256" r="5" class="after"/>
<text x="593.1" y="246" font-size="10.5" class="t" text-anchor="middle">+0.6%</text>
<text x="708" y="260" font-size="10.5" class="t">unchanged</text>
<text x="16" y="328" font-size="11" class="t">Corrected: Zwift publishes 85 m of lead-in for Urumaze and Mech Isle Mayhem, and 66 m for Twilight Crit; the organiser's published event</text>
<text x="16" y="344" font-size="11" class="t">distances put the real figures near 2 km. Controls carry lead-ins that agree with what riders cover, and are untouched by the fix.</text>
</svg>
