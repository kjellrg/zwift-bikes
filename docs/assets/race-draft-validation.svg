<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 404" width="760" height="404" role="img" aria-labelledby="ttl dsc">
<title id="ttl">Race draft validation: solo simulated vs race-mode estimate vs actual</title>
<desc id="dsc">Eight Zwift races. For each, lap speed in km per hour is shown three ways: solo simulated with no draft, the proposed race-mode estimate, and the actual speed recorded on Strava. The two Yumezi Grit rides are dimmed below a divider because the rider was dropped in both and they are excluded from calibration.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.t{fill:#6e7781}
.grid{stroke:#6e7781;opacity:.28}
.conn{stroke:#6e7781;opacity:.5}
.div{stroke:#6e7781;opacity:.55}
.solo{stroke:#57606a;fill:none;stroke-width:1.8}
.est{fill:#bc4c00}
.act{fill:#0969da}
@media (prefers-color-scheme:dark){
.t{fill:#9198a1}
.grid{stroke:#9198a1;opacity:.22}
.conn{stroke:#9198a1;opacity:.45}
.div{stroke:#9198a1;opacity:.5}
.solo{stroke:#b1bac4}
.est{fill:#f0883e}
.act{fill:#58a6ff}
}
</style>
<circle cx="176" cy="18" r="5" class="solo"/>
<text x="188" y="22" font-size="12" class="t">Solo simulated</text>
<path d="M 294.0 12 L 300.0 18 L 294.0 24 L 288.0 18 Z" class="est"/>
<text x="306.0" y="22" font-size="12" class="t">Race mode estimate</text>
<circle cx="440.0" cy="18" r="5.5" class="act"/>
<text x="452.0" y="22" font-size="12" class="t">Actual (Strava)</text>
<line x1="213.3" y1="36" x2="213.3" y2="356" class="grid" stroke-width="0.5"/>
<text x="213.3" y="374" font-size="11" class="t" text-anchor="middle">32</text>
<line x1="288.0" y1="36" x2="288.0" y2="356" class="grid" stroke-width="0.5"/>
<text x="288.0" y="374" font-size="11" class="t" text-anchor="middle">34</text>
<line x1="362.7" y1="36" x2="362.7" y2="356" class="grid" stroke-width="0.5"/>
<text x="362.7" y="374" font-size="11" class="t" text-anchor="middle">36</text>
<line x1="437.3" y1="36" x2="437.3" y2="356" class="grid" stroke-width="0.5"/>
<text x="437.3" y="374" font-size="11" class="t" text-anchor="middle">38</text>
<line x1="512.0" y1="36" x2="512.0" y2="356" class="grid" stroke-width="0.5"/>
<text x="512.0" y="374" font-size="11" class="t" text-anchor="middle">40</text>
<line x1="586.7" y1="36" x2="586.7" y2="356" class="grid" stroke-width="0.5"/>
<text x="586.7" y="374" font-size="11" class="t" text-anchor="middle">42</text>
<line x1="661.3" y1="36" x2="661.3" y2="356" class="grid" stroke-width="0.5"/>
<text x="661.3" y="374" font-size="11" class="t" text-anchor="middle">44</text>
<line x1="736.0" y1="36" x2="736.0" y2="356" class="grid" stroke-width="0.5"/>
<text x="736.0" y="374" font-size="11" class="t" text-anchor="middle">46</text>
<g>
<text x="162" y="56" font-size="12.5" class="t" text-anchor="end">Hell of the North</text>
<line x1="334.7" y1="52" x2="478.0" y2="52" class="conn" stroke-width="1.2"/>
<circle cx="334.7" cy="52" r="5" class="solo"/>
<path d="M 428.7 46 L 434.7 52 L 428.7 58 L 422.7 52 Z" class="est"/>
<circle cx="478.0" cy="52" r="5.5" class="act"/>
</g>
