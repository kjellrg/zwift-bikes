<circle cx="224.5" cy="316" r="5.5" class="act"/>
</g>
<line x1="16" y1="262" x2="736" y2="262" class="div" stroke-width="0.5" stroke-dasharray="3 3"/>
<text x="736" y="278" font-size="11" class="t" text-anchor="end" font-style="italic">excluded from calibration</text>
<text x="456" y="394" font-size="12" class="t" text-anchor="middle">Lap speed (km/h), lead-in excluded</text>
</svg>