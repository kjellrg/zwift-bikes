<text x="162" y="192" font-size="12.5" class="t" text-anchor="end">La Boucle</text>
<line x1="394.0" y1="188" x2="503.0" y2="188" class="conn" stroke-width="1.2"/>
<circle cx="394.0" cy="188" r="5" class="solo"/>
<path d="M 503.0 182 L 509.0 188 L 503.0 194 L 497.0 188 Z" class="est"/>
<circle cx="453.4" cy="188" r="5.5" class="act"/>
</g>
<g>
<text x="162" y="226" font-size="12.5" class="t" text-anchor="end">Rolling Highlands</text>
<line x1="519.1" y1="222" x2="665.1" y2="222" class="conn" stroke-width="1.2"/>
<circle cx="519.1" cy="222" r="5" class="solo"/>
<path d="M 665.1 216 L 671.1 222 L 665.1 228 L 659.1 222 Z" class="est"/>
<circle cx="564.3" cy="222" r="5.5" class="act"/>
</g>
<g opacity="0.6">
<text x="162" y="286" font-size="12.5" class="t" text-anchor="end">Yumezi Grit (B)</text>
<line x1="295.5" y1="282" x2="380.6" y2="282" class="conn" stroke-width="1.2"/>
<circle cx="295.5" cy="282" r="5" class="solo"/>
