<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" role="img" aria-labelledby="ttl dsc">
<title id="ttl">Road to Sky, March 2025: every finisher vs the solo model</title>
<desc id="dsc">Scatter plot of 195 finishers of a March 2025 Road to Sky race up Alpe du Zwift. For each rider, the vertical axis shows their actual finish time relative to what the solo model predicts from their own average power, weight and height; the horizontal axis is their race-average watts per kilogram. Nearly the whole field sits in a narrow band around -7.0 percent faster than the solo model, uniformly across categories A, B and C - unlike flat races, where the spread within one bunch is many times wider. A shaded band from minus 2.5 to minus 5.7 percent marks how much of that offset race mode's own speed-scaled draft term explains at Alpe climbing speeds.</desc>
